# Broker for the door link. Same file for dev and prod (on the VPS next to
# docker-compose.<stage>.yml). passwd and certs/ live only on the VPS.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Nothing needs to survive a broker restart: the backend re-publishes the
# retained access version and the door re-announces itself on reconnect.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice

# Inside the Docker network only (backend). Not published on the host.
listener 1883

# The door, over the internet: TLS. Self-signed cert — the door encrypts but
# doesn't verify it, same as its HTTPS calls without API_ROOT_CA.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
