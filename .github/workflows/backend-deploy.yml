# Backend: build on GHA, stream image to VPS (no ghcr pull on server).
# develop -> dev only | main -> prod only
# Repo secrets: VPS_HOST, VPS_USER, VPS_PORT, VPS_SSH_KEY.
name: Backend Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'mosquitto/**'
      - 'docker-compose.prod.yml'
      - 'docker-compose.dev.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # develop -> dev, main -> prod
      STAGE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet build backend/SmartDoor.Api.csproj

      - run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          load: true
          tags: |
            ghcr.io/amrmzfr-dev/fullstack-smart-door-app-backend:${{ env.STAGE }}
            ghcr.io/amrmzfr-dev/fullstack-smart-door-app-backend:${{ env.STAGE }}-${{ env.SHA_SHORT }}

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          SRC_IMAGE="ghcr.io/amrmzfr-dev/fullstack-smart-door-app-backend:${STAGE}-${SHA_SHORT}"
          DEPLOY_IMAGE="ghcr.io/amrmzfr-dev/fullstack-smart-door-app-backend:${STAGE}"
          APP_DIR="/opt/smart-door-${STAGE}"
          COMPOSE_FILE="docker-compose.${STAGE}.yml"
          KEY_DIR="${RUNNER_TEMP}/deploy-ssh"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY_DIR/key"
          chmod 600 "$KEY_DIR/key"
          SSH_PORT="${VPS_PORT:-22}"
          SSH_BASE=(ssh -i "$KEY_DIR/key" -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          scp -i "$KEY_DIR/key" -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$COMPOSE_FILE" "${VPS_USER}@${VPS_HOST}:${APP_DIR}/${COMPOSE_FILE}"
          # Broker config (passwd + certs stay on the VPS only). Uploaded next
          # to the live files, copied over only if different (cp keeps the
          # file the container has mounted), and the broker restarted then.
          "${SSH_BASE[@]}" "${VPS_USER}@${VPS_HOST}" "mkdir -p '$APP_DIR/mosquitto/incoming'"
          scp -i "$KEY_DIR/key" -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            mosquitto/mosquitto.conf mosquitto/acl "${VPS_USER}@${VPS_HOST}:${APP_DIR}/mosquitto/incoming/"
          docker save "$SRC_IMAGE" | gzip -1 | "${SSH_BASE[@]}" "${VPS_USER}@${VPS_HOST}" 'gunzip -c | docker load'
          "${SSH_BASE[@]}" "${VPS_USER}@${VPS_HOST}" \
            "cd '$APP_DIR/mosquitto' && changed=0 && for f in mosquitto.conf acl; do if ! cmp -s incoming/\$f \$f; then cp incoming/\$f \$f; changed=1; fi; done && cd '$APP_DIR' && docker compose -f '$COMPOSE_FILE' up -d --no-deps mosquitto && if [ \$changed = 1 ]; then docker compose -f '$COMPOSE_FILE' restart mosquitto; fi"
          "${SSH_BASE[@]}" "${VPS_USER}@${VPS_HOST}" \
            "docker tag '$SRC_IMAGE' '$DEPLOY_IMAGE' && cd '$APP_DIR' && docker compose -f '$COMPOSE_FILE' stop backend || true && docker compose -f '$COMPOSE_FILE' rm -f backend || true && docker compose -f '$COMPOSE_FILE' up -d --no-deps backend"
