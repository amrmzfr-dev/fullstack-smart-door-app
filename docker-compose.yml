# Local dev infrastructure only — run the backend with `dotnet run` and the
# frontend with `npm run dev`. Ports are shifted (5433 / 6380) so this can run
# next to the Gate Sensor stack.
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-door-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdoor
      POSTGRES_PASSWORD: smartdoor
      POSTGRES_DB: smartdoor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-door-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
