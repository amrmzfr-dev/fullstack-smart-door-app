# Dev on the VPS (/opt/smart-door-dev). Images are built by GitHub Actions
# and streamed to the server — see .github/workflows.
#   utils-dev.czeros.tech      -> nginx -> 127.0.0.1:3009 (frontend)
#   utils-api-dev.czeros.tech  -> nginx -> 127.0.0.1:8099 (backend)
#   103.20.240.48:8884         -> mosquitto (door MQTT over TLS)
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-door-postgres-dev
    restart: unless-stopped
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD come from here.
    env_file: .env.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: smart-door-redis-dev
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-door-mosquitto-dev
    restart: unless-stopped
    # The door connects here over TLS (8883 inside). passwd + certs/ exist
    # only on the VPS; mosquitto.conf + acl come from the repo.
    ports:
      - "8884:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
    networks:
      - default

  backend:
    image: ghcr.io/amrmzfr-dev/fullstack-smart-door-app-backend:dev
    container_name: smart-door-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env.dev
    ports:
      - "127.0.0.1:8099:8080"
    networks:
      - default

  frontend:
    image: ghcr.io/amrmzfr-dev/fullstack-smart-door-app-frontend:dev
    container_name: smart-door-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3009:80"
    networks:
      - default

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.49.0.0/16
          gateway: 172.49.0.1
